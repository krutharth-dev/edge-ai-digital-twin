name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold:
    name: Documentation and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight checks
        run: python -m pip install pytest PyYAML ruff
      - name: Validate repository documentation and templates
        run: python -m pytest -q tests/test_repository_quality.py
      - name: Check Python lint
        run: python -m ruff check tests
