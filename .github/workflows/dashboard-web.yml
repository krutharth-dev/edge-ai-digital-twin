name: React FastAPI dashboard checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'web_api/**'
      - 'tests/test_dashboard_api.py'
      - 'requirements-web.txt'
      - 'requirements-dev.txt'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'web_api/**'
      - 'tests/test_dashboard_api.py'
      - 'requirements-web.txt'
      - 'requirements-dev.txt'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_dashboard_api.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
