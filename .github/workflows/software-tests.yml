name: Software MVP tests
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_software_mvp.py tests/test_real_training.py tests/test_readme.py
      - run: python scripts/check_environment.py
      - run: python -m compileall -q edge_ai_twin ai dashboard raspberry-pi simulator scripts

  mqtt_integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Start local Mosquitto on test port
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto
          mosquitto -p 18884 -d
      - name: Check publisher to SQLite to Digital Twin alerts
        run: python tests/smoke_mqtt.py --port 18884
